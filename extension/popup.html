<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

html {
  width: 300px;
  height: 450px;
  overflow: hidden;
}

body {
  width: 300px;
  height: 450px;
  margin: 0;
  padding: 16px;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #030712;
  color: #f3f4f6;
  overflow: hidden;
  position: relative;
}

      body::before {
        content: '';
        position: absolute;
        inset: -50%;
        background:
          radial-gradient(circle at 20% 30%, rgba(34,197,94,0.12) 0%, transparent 40%),
          radial-gradient(circle at 80% 70%, rgba(59,130,246,0.15) 0%, transparent 45%),
          radial-gradient(circle at 50% 10%, rgba(168,85,247,0.08) 0%, transparent 35%);
        z-index: 0;
        animation: ambientShift 12s ease-in-out infinite alternate;
      }

      @keyframes ambientShift {
        0%   { transform: rotate(0deg) scale(1); }
        100% { transform: rotate(8deg) scale(1.15); }
      }

      body::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
        background-size: 16px 16px;
        z-index: 0;
        pointer-events: none;
      }

      .content { position: relative; z-index: 1; }

      /* ── Fixed Header Alignment Layout ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  width: 100%;
}

.header-left { 
  display: flex; 
  align-items: center; 
  gap: 8px;
  flex-shrink: 0;
}

.logo-icon {
  font-size: 18px;
  line-height: 1;
  animation: float 3s ease-in-out infinite;
}

.logo-text {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #22c55e, #3b82f6, #a855f7);
  background-size: 200% auto;
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 4s linear infinite;
  line-height: 1;
}

/* Explicit scaling protections to stop content overflow */

  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  width: 100%;
}

.header-left { 
  display: flex; 
  align-items: center; 
  gap: 8px;
  flex-shrink: 0;
}

.logo-icon {
  font-size: 18px;
  line-height: 1;
  animation: float 3s ease-in-out infinite;
}

.logo-text {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #22c55e, #3b82f6, #a855f7);
  background-size: 200% auto;
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 4s linear infinite;
  line-height: 1;
}

/* Explicit scaling protections to stop content overflow */
.live-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(34, 197, 94, 0.12);
  border: 1px solid rgba(34, 197, 94, 0.3);
  padding: 4px 10px;
  border-radius: 9999px;
  font-size: 10px;
  font-weight: 800;
  color: #4ade80;
  letter-spacing: 0.05em;
  flex-shrink: 0;
  line-height: 1;
}

.live-dot {
  width: 6px;
  height: 6px;
  background: #22c55e;
  border-radius: 50%;
  box-shadow: 0 0 8px #22c55e;
  flex-shrink: 0;
  animation: livepulse 2s cubic-bezier(0.4,0,0.6,1) infinite;
}

      @keyframes livepulse {
        0%, 100% { transform: scale(1);   opacity: 1; }
        50%       { transform: scale(1.3); opacity: 0.4; }
      }

      /* ── Scanning state ── */
      .scanning {
        text-align: center;
        padding: 32px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .scan-container {
        position: relative;
        width: 60px;
        height: 60px;
        margin-bottom: 16px;
      }

      .scan-ring {
        position: absolute;
        inset: 0;
        border: 2px solid rgba(59,130,246,0.1);
        border-top-color: #3b82f6;
        border-right-color: #22c55e;
        border-radius: 50%;
        animation: spin 1.2s cubic-bezier(0.5,0,0.5,1) infinite;
      }

      .scan-ring-inner {
        position: absolute;
        inset: 8px;
        border: 2px dashed rgba(168,85,247,0.15);
        border-bottom-color: #a855f7;
        border-radius: 50%;
        animation: spinReverse 2s linear infinite;
      }

      @keyframes spin        { to { transform: rotate(360deg);  } }
      @keyframes spinReverse { to { transform: rotate(-360deg); } }

      .scan-text {
        font-size: 12px;
        color: #94a3b8;
        animation: pulseText 1.5s ease-in-out infinite;
      }

      @keyframes pulseText {
        0%, 100% { opacity: 0.6; }
        50%       { opacity: 1; color: #f3f4f6; }
      }

      /* ── Dashboard state ── */
      .dashboard {
        animation: fadeIn 0.4s cubic-bezier(0.16,1,0.3,1) forwards;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .summary-text {
        font-size: 12px;
        color: #94a3b8;
        text-align: center;
        margin-bottom: 16px;
        line-height: 1.4;
      }

      /* FIXED FIXTURE: Uniform circle chart frame scaling masks */
      .chart-wrapper {
        position: relative;
        width: 150px;
        height: 150px;
        margin: 0 auto 20px;
        border-radius: 50%;
        overflow: visible;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      canvas {
        display: block;
        border-radius: 50%;
      }

      .chart-glow {
        position: absolute;
        inset: -4px;
        background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 75%);
        border-radius: 50%;
        filter: blur(6px);
        pointer-events: none;
        z-index: -1;
      }

      .chart-center {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        pointer-events: none;
        z-index: 2;
      }

      .chart-total {
        font-size: 28px;
        font-weight: 800;
        color: #fff;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      .chart-label {
        font-size: 10px;
        color: #64748b;
        font-weight: 700;
        margin-top: 4px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .verdict-box {
        background: rgba(13,21,38,0.8);
        border: 1px solid rgba(234, 179, 8, 0.2);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .verdict-icon {
        font-size: 14px;
        color: #eab308;
        flex-shrink: 0;
      }

      .verdict-text {
        font-size: 11px;
        color: #94a3b8;
        line-height: 1.4;
        text-align: left;
      }

      .stats-row {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }

      .stat-card {
        flex: 1;
        background: rgba(13,21,38,0.6);
        border: 1px solid #1e293b;
        border-radius: 12px;
        padding: 12px 6px;
        text-align: center;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
      }

      .stat-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 2px;
      }

      .stat-card.green::before  { background: #22c55e; }
      .stat-card.yellow::before { background: #eab308; }
      .stat-card.red::before    { background: #ef4444; }

      .stat-card:hover { transform: translateY(-3px); border-color: #334155; }
      .stat-card.green:hover  { box-shadow: 0 4px 12px rgba(34,197,94,0.15); }
      .stat-card.yellow:hover { box-shadow: 0 4px 12px rgba(234,179,8,0.15); }
      .stat-card.red:hover    { box-shadow: 0 4px 12px rgba(239,68,68,0.15); }

      .stat-number {
        font-size: 22px;
        font-weight: 700;
        line-height: 1;
        margin-bottom: 4px;
      }

      .stat-number.green  { color: #4ade80; }
      .stat-number.yellow { color: #facc15; }
      .stat-number.red    { color: #f87171; }

      .stat-label {
        font-size: 9px;
        font-weight: 600;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .reset-btn {
        width: 100%;
        padding: 11px;
        background: rgba(30,41,59,0.4);
        border: 1px solid rgba(255,255,255,0.05);
        color: #94a3b8;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .reset-btn:hover  { background: #1e293b; color: #f3f4f6; border-color: rgba(255,255,255,0.15); }
      .reset-btn:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <div class="content">
      <div class="header">
        <div class="header-left">
          <span class="logo-icon">🔍</span>
          <span class="logo-text">TrustLens AI</span>
        </div>
        <div class="live-badge">
          <div class="live-dot"></div>
          LIVE
        </div>
      </div>

      <div id="main">
        <div class="dashboard">
          <p class="summary-text">AI analyzed <strong>13</strong> reviews on this page</p>
          
          <div id="chart-placeholder"></div>

          <div class="verdict-box">
            <span class="verdict-icon">⚠️</span>
            <p class="verdict-text">Mixed signals detected. Read reviews carefully before buying.</p>
          </div>

          <div class="stats-row">
            <div class="stat-card green">
              <div class="stat-number green">8</div>
              <div class="stat-label">Real</div>
            </div>
            <div class="stat-card yellow">
              <div class="stat-number yellow">4</div>
              <div class="stat-label">Suspect</div>
            </div>
            <div class="stat-card red">
              <div class="stat-number red">1</div>
              <div class="stat-label">Fake</div>
            </div>
          </div>

          <button class="reset-btn">
            <span>🔄</span> SHOW ALL REVIEWS
          </button>
        </div>
      </div>
    </div>

    
    <script src="popup.js"></script>
  </body>
</html>
